name: Build Android APK (Unity 6)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Unity 6000.0.85f2 Android
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.85f2-android-3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unity license (entitlement)
        shell: bash
        run: |
          set -e
          HOME_DIR="${HOME:-/root}"
          mkdir -p "$HOME_DIR/.config/unity3d/Unity/licenses"
          echo "${{ secrets.UNITY_ENTITLEMENT }}" | base64 -d > "$HOME_DIR/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml"
          ls -la "$HOME_DIR/.config/unity3d/Unity/licenses/"

      - name: Build APK
        shell: bash
        run: |
          set -e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            /opt/unity/Editor/Unity -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod CIBuild.BuildAndroid \
            -logFile -

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: build/Android/*.apk
          if-no-files-found: error
