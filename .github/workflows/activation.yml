name: Unity License Activation (manual .alf)

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate manual activation file (.alf)
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2019.4.16f1-android-3
    steps:
      - name: Generate .alf
        shell: bash
        run: |
          set -x
          xvfb-run --auto-servernum --server-args='-screen 0 640x480x24' \
            /opt/unity/Editor/Unity -batchmode -nographics -logFile - \
            -createManualActivationFile -quit || true
          echo "--- files ---"
          ls -la
          ls -la *.alf
      - name: Upload .alf
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2019.4.16f1.alf
          path: "*.alf"
